<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet Support — Admin</title><style>
:root{color-scheme:dark;--orange:#f7931a;--bg:#070707;--panel:#11100e;--muted:#b8b0a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2a1708 0,transparent 45%),var(--bg);color:#f7f2ec;font:16px system-ui, sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:36px auto}.panel{border:1px solid #f7931a66;border-radius:20px;padding:22px;background:#0d0c0bf2;box-shadow:0 15px 50px #0008}h1{margin:0 0 8px}h1 span{color:var(--orange)}p{color:var(--muted)}input,button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #7d4b1b;background:#080807;color:white}input{width:min(500px,100%)}button{cursor:pointer;background:linear-gradient(100deg,#f7931a,#ffc15c);color:#1a1005;font-weight:800;border:0}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#status{color:#f7c27f;white-space:pre-wrap}.table-wrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff18;vertical-align:top}th{color:#f7c27f}td{overflow-wrap:anywhere}.muted{color:#aaa;font-size:13px}.pill{color:#f7c27f;border:1px solid #75481b;border-radius:20px;padding:4px 8px;font-size:12px}</style></head><body><main class="wrap"><section class="panel"><h1>Wallet Support <span>Admin</span></h1><p>Private dashboard for incoming support requests. Keep your admin token secret.</p><div class="bar"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token"><button id="load">Load requests</button><button id="refresh">Refresh</button></div><div id="status" role="status">Enter your admin token to view submissions.</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Wallet</th><th>Email</th><th>Public address</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const token=document.getElementById('token'),statusEl=document.getElementById('status'),rows=document.getElementById('rows');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const t=token.value.trim();if(!t){statusEl.textContent='Enter your admin token.';return}statusEl.textContent='Loading…';try{const r=await fetch('/api/admin/submissions',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load requests');rows.innerHTML='';for(const x of d.submissions){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(new Date(x.createdAt).toLocaleString())}<div class="muted">${esc(x.id)}</div></td><td>${esc(x.walletName)}</td><td>${esc(x.email)}</td><td>${esc(x.publicAddress||'—')}</td><td><span class="pill">${esc(x.status)}</span></td><td><select aria-label="Status for ${esc(x.walletName)}" data-id="${esc(x.id)}"><option ${x.status==='new'?'selected':''}>new</option><option value="in-progress" ${x.status==='in-progress'?'selected':''}>in-progress</option><option value="resolved" ${x.status==='resolved'?'selected':''}>resolved</option></select> <button data-save="${esc(x.id)}">Save</button></td>`;rows.appendChild(tr)}statusEl.textContent=`Loaded ${d.submissions.length} request(s).`}catch(e){statusEl.textContent=e.message}}rows.addEventListener('click',async e=>{const id=e.target.dataset.save;if(!id)return;const sel=rows.querySelector(`select[data-id="${CSS.escape(id)}"]`);try{const r=await fetch('/api/admin/submissions/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token.value.trim()},body:JSON.stringify({status:sel.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Update failed');statusEl.textContent='Status updated.';load()}catch(err){statusEl.textContent=err.message}});document.getElementById('load').onclick=load;document.getElementById('refresh').onclick=load;</script></body></html>
